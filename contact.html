<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Modern Contact Form</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
      }

      body {
        background-image: url("profile1.jpg");
        background-size: cover;
        background-position: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        text-align: center;
        padding-top: 90px;
      }

      /* Navigation Bar */
      nav {
        background-color: white;
        color: black;
        padding: 15px 5%;
        display: flex;
        align-items: center;
        justify-content: space-between;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        z-index: 100;
        box-shadow: 0px 2px 10px rgba(0, 0, 0, 0.1);
      }

      .logo {
        width: 180px;
        height: auto;
      }

      nav ul {
        list-style-type: none;
        display: flex;
        gap: 20px;
      }

      nav ul li {
        display: inline;
      }

      nav ul li a {
        color: black;
        text-decoration: none;
        font-weight: bold;
        font-size: 15px;
        transition: color 0.3s ease;
      }

      nav ul li a:hover {
        color: red;
      }

      .nav-btn {
        background: #e91e63;
        color: white;
        padding: 8px 15px;
        border-radius: 50px;
        font-size: 14px;
        font-weight: bold;
        text-decoration: none;
        transition: 0.3s;
      }

      .nav-btn:hover {
        background: black;
      }

      .nav-btn {
        background: #e91e63;
        color: white;
        padding: 8px 15px;
        border-radius: 50px;
        font-size: 14px;
        font-weight: bold;
        text-decoration: none;
        transition: 0.3s;
      }

      .nav-btn:hover {
        background: black;
      }

      .title {
        font-size: 24px;
        font-weight: bold;
        text-transform: uppercase;
        color: white;
        letter-spacing: 2px;
        margin-bottom: 20px;
      }

      .container {
        background: rgba(255, 255, 255, 0.95);
        padding: 40px;
        width: 650px; /* Increased width */
        border-radius: 0px; /* Remove rounded edges */
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        position: relative;
        transform: translateX(-100px); /* Moved form more to the left */
      }

      h3 {
        text-align: left;
        font-size: 22px;
        color: black;
        margin-bottom: 15px;
      }

      label {
        display: block;
        font-weight: bold;
        text-align: left;
        color: black;
        margin-top: 10px;
        font-size: 14px;
      }

      input,
      textarea {
        width: 80%;
        padding: 8px 0;
        margin-top: 5px;
        border: none; /* Remove default borders */
        border-bottom: 2px solid #ccc; /* Add bottom border to create a line effect */
        outline: none; /* Remove focus outline */
        font-size: 14px;
        background: transparent;
        text-align: left;
        margin-left: -100px; /* Move text boxes to the left */
      }

      textarea {
        height: 60px; /* Keep the textarea size minimal */
      }

      .map-container {
        position: absolute;
        top: 45px;
        right: -230px; /* Adjusted for new container size */
        width: 300px; /* Increased width */
        height: 250px; /* Increased height */
        border-radius: 5px;
        overflow: hidden;
        border: 5px solid #e91e63;
      }

      iframe {
        width: 100%;
        height: 100%;
        border: none;
      }

      .send-button-container {
        display: flex;
        justify-content: center;
        margin-top: 20px;
      }

      .btn {
        background: #e91e63;
        color: white;
        padding: 15px 75px;
        border: none;
        border-radius: 0px;
        font-size: 16px;
        cursor: pointer;
        text-transform: uppercase;
        font-weight: bold;
      }

      .btn:hover {
        background: #c2185b;
      }

      .footer {
        margin-top: 15px;
        font-size: 12px;
        color: white;
      }

      .footer span {
        color: red;
      }

      p {
        font-family: Cambria, Cochin, Georgia, Times, "Times New Roman", serif;
      }
    </style>
  </head>
  <body>
    <!-- Navigation Bar -->
    <nav>
      <img src="logo.jpg" alt="Logo" class="logo" />
      <ul>
        <li><a href="home.html">HOME</a></li>
        <li><a href="adoptpet.html">ADOPT A PET</a></li>
        <li><a href="about.html">ABOUT US</a></li>
        <li><a href="vet_consult.html">VETERINARY</a></li>
        <li><a href="donate.html">DONATE</a></li>
        <li><a href="contact.html">CONTACT</a></li>
        <li>
          <a href="registration.html" class="nav-btn">SIGN IN / SIGN UP</a>
        </li>
      </ul>
    </nav>

    <div class="title">CONTACT FORM</div>

    <div class="container">
      <h3>CONTACT US</h3>
      <form action="contact.php" method="POST">
        <label for="name">NAME</label>
        <input type="text" name="name" id="name" required />

        <label for="email">E-MAIL</label>
        <input type="email" name="email" id="email" required />

        <label for="message">MESSAGE</label>
        <textarea
          id="message"
          name="message"
          placeholder="Enter Your Message here..."
          required
        ></textarea>
      

      <div class="map-container">
        <iframe
          src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3151.8354345093706!2d144.95373531531676!3d-37.81627977975171!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x6ad642af0f11fd81%3A0xf0727c9fdd762cc5!2sFrance!5e0!3m2!1sen!2sin!4v1604727174586!5m2!1sen!2sin"
          allowfullscreen=""
        >
        </iframe>
      </div>
    </div>

    <!-- Centered Send Button Outside Container -->
    <div class="send-button-container">
      <button type="submit" class="btn">SEND</button>
    </div>
  </form>
    <!-- Footer Section -->
    <footer class="footer">
      <p>
        &copy; 2025 Pet Adoption Platform. All Rights Reserved | Designed with

      </p>
    </footer>
  </body>
</html>
