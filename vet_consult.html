<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Veterinary Consultation</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
      }

      body,
      html {
        background-image: url("1OFO.gif"); /* Replace with your GIF URL */
        background-size: cover; /* Adjusts size to cover the screen */
        background-repeat: no-repeat; /* Prevents repeating */
        background-position: center; /* Centers the GIF */
        height: 100vh;
        margin: 0;
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: #f4f4f4;
        flex-direction: column; /* Ensures navbar and container stack properly */
      }

      /* Navigation Bar */
      nav {
        background-color: white;
        color: black;
        padding: 15px 5%;
        display: flex;
        align-items: center;
        justify-content: space-between; /* Pushes logo to the left and links to the right */
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        z-index: 100;
        box-shadow: 0px 2px 10px rgba(0, 0, 0, 0.1); /* Adds subtle shadow */
      }

      /* Logo Styling */
      .logo {
        width: 180px; /* Adjust width as needed */
        height: auto;
      }

      nav ul {
        list-style-type: none;
        display: flex;
        gap: 20px; /* Adds space between menu items */
      }

      nav ul li {
        display: inline;
      }

      nav ul li a {
        color: black;
        text-decoration: none;
        font-weight: bold;
        font-size: 15px;
        transition: color 0.3s ease;
      }

      nav ul li a:hover {
        color: red;
      }

      .nav-btn {
        background: #e91e63;
        color: white;
        padding: 8px 15px;
        border-radius: 50px;
        font-size: 14px;
        font-weight: bold;
        text-decoration: none;
        transition: 0.3s;
      }

      .nav-btn:hover {
        background: black;
      }

      .container {
        position: relative;
        width: 100%;
        height: 100%;

        display: flex;
        align-items: center;
        justify-content: flex-start;
        padding: 5%;
        margin-top: 80px; /* Push content down to avoid overlap with navbar */
      }

      .content {
        padding: 30px;
        border-radius: 10px;
        color: rgb(236, 241, 90);
        max-width: 450px;
        margin-top: -50px; /* Moves the content up */
      }

      .content h1 {
        font-size: 36px;
        font-weight: bold;
        margin-bottom: 15px;
      }

      .price {
        background: white;
        color: black;
        padding: 8px 12px;
        border-radius: 5px;
        font-weight: bold;
        display: inline-block;
        margin-bottom: 15px;
        font-size: 20px;
      }

      .content p {
        font-size: 20px;
        margin-bottom: 20px;
      }

      .consult-btn {
        display: inline-block;
        background-color: #e91e63;
        color: white;
        padding: 15px 25px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-size: 20px;
        text-decoration: none;
        transition: background 0.3s;
      }

      .consult-btn:hover {
        background-color: #e91e63;
      }

      @media (max-width: 768px) {
        nav {
          flex-direction: column;
          align-items: center;
          padding: 10px 0;
        }

        nav ul {
          flex-wrap: wrap;
          justify-content: center;
          padding-top: 10px;
        }

        .container {
          padding: 20px;
          justify-content: center;
          text-align: center;
        }

        .content {
          max-width: 90%;
        }

        .consult-btn {
          display: inline-block;
          background: linear-gradient(
            135deg,
            #ff7e5f,
            #ff3e78
          ); /* Gradient effect */
          color: white;
          padding: 15px 30px;
          border: none;
          border-radius: 50px; /* Oval shape */
          font-size: 18px;
          font-weight: bold;
          text-decoration: none;
          text-align: center;
          transition: all 0.3s ease-in-out;
          box-shadow: 0 4px 10px rgba(255, 62, 120, 0.3); /* Soft shadow */
          position: relative;
          overflow: hidden;
        }

        .consult-btn:hover {
          background: linear-gradient(
            135deg,
            #ff3e78,
            #ff7e5f
          ); /* Reverse gradient */
          box-shadow: 0 6px 15px rgba(255, 62, 120, 0.5);
          transform: translateY(-3px); /* Lifting effect */
        }
      }
    </style>
  </head>
  <body>
    <!-- Navigation Bar -->
    <nav>
      <img src="logo.jpg" alt="Logo" class="logo" />
      <ul>
        <li><a href="home.html">HOME</a></li>
        <li><a href="adoptpet.html">ADOPT A PET</a></li>
        <li><a href="about.html">ABOUT US</a></li>
        <li><a href="vet_consult.html">VETERINARY</a></li>
        <li><a href="donate.html">DONATE</a></li>
        <li><a href="contact.html">CONTACT</a></li>
        <li>
          <a href="registration.html" class="nav-btn">SIGN IN / SIGN UP</a>
        </li>
      </ul>
    </nav>

    <div class="container">
      <div class="content">
        <h1>Instant & complete vet care, wherever you are</h1>
        <p class="price">At only ₹299, get end-to-end support from our vets.</p>
        <p>
          Get professional veterinary advice and guidance for your pet's health.
        </p>
        <a href="consult.html" class="consult-btn">Consult Now</a>
      </div>
    </div>
  </body>
</html>
